<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #gameCanvas {
      border: 3px solid #444;
      display: block;
    }

    #info {
      color: #aaa;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="info">방향키(↑ ↓ ← →)로 파란 원을 이동하세요</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const MAP_SIZE = 500;
    const CIRCLE_RADIUS = 20;
    const SPEED = 4;

    canvas.width = MAP_SIZE;
    canvas.height = MAP_SIZE;

    const circle = {
      x: MAP_SIZE / 2,
      y: MAP_SIZE / 2,
      hp: 100,
      maxHp: 100,
    };

    const ARROW_SPEED = 3;
    const arrows = [];

    const blackCircles = [];
    const explosions = [];
    const BLACK_RADIUS = CIRCLE_RADIUS / 1.3;
    const EXPLODE_RADIUS = CIRCLE_RADIUS * 2.2;
    const EXPLODE_DELAY = 1500;

    function spawnBlackCircle() {
      blackCircles.push({
        x: BLACK_RADIUS + Math.random() * (MAP_SIZE - BLACK_RADIUS * 2),
        y: BLACK_RADIUS + Math.random() * (MAP_SIZE - BLACK_RADIUS * 2),
        explodeAt: Date.now() + EXPLODE_DELAY,
      });
    }

    function triggerExplosion(bc) {
      explosions.push({ x: bc.x, y: bc.y, r: BLACK_RADIUS, maxR: EXPLODE_RADIUS, alpha: 1 });
      if (Math.hypot(circle.x - bc.x, circle.y - bc.y) < EXPLODE_RADIUS + CIRCLE_RADIUS) {
        circle.hp = Math.max(0, circle.hp - 9);
      }
    }

    setInterval(() => { if (circle.hp > 0) spawnBlackCircle(); }, 2000);

    function spawnArrowToward(tx, ty) {
      const edge = Math.floor(Math.random() * 4);
      let fx, fy;
      if (edge === 0) { fx = Math.random() * MAP_SIZE; fy = 0; }
      else if (edge === 1) { fx = MAP_SIZE; fy = Math.random() * MAP_SIZE; }
      else if (edge === 2) { fx = Math.random() * MAP_SIZE; fy = MAP_SIZE; }
      else { fx = 0; fy = Math.random() * MAP_SIZE; }

      const dx = tx - fx;
      const dy = ty - fy;
      const dist = Math.hypot(dx, dy);
      arrows.push({
        x: fx,
        y: fy,
        vx: (dx / dist) * ARROW_SPEED,
        vy: (dy / dist) * ARROW_SPEED,
        angle: Math.atan2(dy, dx),
        targetX: tx,
        targetY: ty,
      });
    }

    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false,
    };

    const IDLE_LIMIT = 3000;
    let gameStarted = false;
    let lastKeyTime = 0;

    document.addEventListener('keydown', (e) => {
      if (!keys.hasOwnProperty(e.key)) return;
      e.preventDefault();
      if (!keys[e.key]) {
        if (!gameStarted) gameStarted = true;
        lastKeyTime = Date.now();
        const tx = circle.x;
        const ty = circle.y;
        setTimeout(() => { if (circle.hp > 0) spawnArrowToward(tx, ty); }, 500);
      }
      keys[e.key] = true;
    });

    document.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = false;
      }
    });

    function updateArrows() {
      for (let i = arrows.length - 1; i >= 0; i--) {
        const a = arrows[i];
        a.x += a.vx;
        a.y += a.vy;

        // 원과 충돌 감지
        if (Math.hypot(a.x - circle.x, a.y - circle.y) < CIRCLE_RADIUS) {
          circle.hp = Math.max(0, circle.hp - 17);
          arrows.splice(i, 1);
          continue;
        }

        const dx = a.targetX - a.x;
        const dy = a.targetY - a.y;
        if (Math.hypot(dx, dy) < ARROW_SPEED + 1) {
          arrows.splice(i, 1);
        }
      }
    }

    const WARN_DIST = ARROW_SPEED * 60 * 1.3; // 1.3초 전 경고 거리

    function drawArrow(a) {
      const remaining = Math.hypot(a.targetX - a.x, a.targetY - a.y);

      if (remaining < WARN_DIST) {
        const alpha = 1 - remaining / WARN_DIST;
        ctx.save();
        ctx.strokeStyle = `rgba(255, 50, 50, ${0.3 + alpha * 0.7})`;
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(a.targetX, a.targetY);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.angle);

      // 화살대
      ctx.strokeStyle = '#8B5E3C';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-18, 0);
      ctx.lineTo(14, 0);
      ctx.stroke();

      // 화살촉 (금속)
      ctx.fillStyle = '#aaa';
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(22, 0);
      ctx.lineTo(14, -4);
      ctx.lineTo(16, 0);
      ctx.lineTo(14, 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 깃털 (왼쪽 위)
      ctx.fillStyle = '#e8e8c0';
      ctx.strokeStyle = '#bbb89a';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(-18, 0);
      ctx.lineTo(-10, -6);
      ctx.lineTo(-8, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 깃털 (왼쪽 아래)
      ctx.beginPath();
      ctx.moveTo(-18, 0);
      ctx.lineTo(-10, 6);
      ctx.lineTo(-8, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function updateBlackCircles() {
      const now = Date.now();
      for (let i = blackCircles.length - 1; i >= 0; i--) {
        if (now >= blackCircles[i].explodeAt) {
          triggerExplosion(blackCircles[i]);
          blackCircles.splice(i, 1);
        }
      }
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        ex.r += (ex.maxR - ex.r) * 0.15;
        ex.alpha -= 0.04;
        if (ex.alpha <= 0) explosions.splice(i, 1);
      }
    }

    function update() {
      if (keys.ArrowUp)    circle.y = Math.max(CIRCLE_RADIUS, circle.y - SPEED);
      if (keys.ArrowDown)  circle.y = Math.min(MAP_SIZE - CIRCLE_RADIUS, circle.y + SPEED);
      if (keys.ArrowLeft)  circle.x = Math.max(CIRCLE_RADIUS, circle.x - SPEED);
      if (keys.ArrowRight) circle.x = Math.min(MAP_SIZE - CIRCLE_RADIUS, circle.x + SPEED);
      if (gameStarted && Date.now() - lastKeyTime >= IDLE_LIMIT) {
        circle.hp = 0;
      }
      updateArrows();
      updateBlackCircles();
    }

    function draw() {
      // 회색 정사각형 맵
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

      // 파란색 원
      ctx.beginPath();
      ctx.arc(circle.x, circle.y, CIRCLE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#1e90ff';
      ctx.fill();
      ctx.strokeStyle = '#63b3ff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 체력바 배경
      const barWidth = CIRCLE_RADIUS * 2 + 10;
      const barHeight = 6;
      const barX = circle.x - barWidth / 2;
      const barY = circle.y - CIRCLE_RADIUS - 12;
      ctx.fillStyle = '#333';
      ctx.fillRect(barX, barY, barWidth, barHeight);

      // 체력바
      const hpRatio = circle.hp / circle.maxHp;
      const hpColor = hpRatio > 0.5 ? '#00cc44' : hpRatio > 0.25 ? '#ffaa00' : '#ff3333';
      ctx.fillStyle = hpColor;
      ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);

      // 검정색 원들
      const now = Date.now();
      for (const bc of blackCircles) {
        const remaining = bc.explodeAt - now;
        const warn = Math.max(0, 1 - remaining / EXPLODE_DELAY);

        // 폭발 예고 범위
        ctx.beginPath();
        ctx.arc(bc.x, bc.y, EXPLODE_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 80, 0, ${warn * 0.25})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(255, 80, 0, ${0.3 + warn * 0.7})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 검정 원 (깜빡임)
        const blink = remaining < 500 && Math.floor(remaining / 100) % 2 === 0;
        ctx.beginPath();
        ctx.arc(bc.x, bc.y, BLACK_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = blink ? '#ff4400' : '#111';
        ctx.fill();
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // 폭발 이펙트
      for (const ex of explosions) {
        ctx.beginPath();
        ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 120, 0, ${ex.alpha * 0.5})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(255, 200, 0, ${ex.alpha})`;
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // 화살
      for (const a of arrows) drawArrow(a);

      // 체력 수치 텍스트
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`${circle.hp} / ${circle.maxHp}`, circle.x, barY - 3);

      // 대기 타이머
      if (gameStarted) {
        const idle = Date.now() - lastKeyTime;
        const remaining = Math.max(0, (IDLE_LIMIT - idle) / 1000);
        const danger = remaining < 1;
        ctx.font = `bold 14px Arial`;
        ctx.fillStyle = danger ? '#ff3333' : '#fff';
        ctx.textAlign = 'right';
        ctx.fillText(`⏱ ${remaining.toFixed(1)}s`, MAP_SIZE - 8, 20);
      } else {
        ctx.font = '13px Arial';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.textAlign = 'center';
        ctx.fillText('방향키를 눌러 시작하세요', MAP_SIZE / 2, MAP_SIZE / 2 + 40);
      }
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff3333';
      ctx.font = 'bold 64px Arial';
      ctx.fillText('게임오버', MAP_SIZE / 2, MAP_SIZE / 2);

      ctx.fillStyle = '#fff';
      ctx.font = '20px Arial';
      ctx.fillText('체력이 모두 소진되었습니다', MAP_SIZE / 2, MAP_SIZE / 2 + 48);
    }

    function gameLoop() {
      update();
      draw();
      if (circle.hp <= 0) {
        drawGameOver();
        return;
      }
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
