<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100스테이지 살아남기</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    #gameCanvas { display: block; }
    #diffUI {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: auto; z-index: 10;
    }
    #diffUI h2 { color: #fff; font: bold 26px Arial; margin-bottom: 18px; letter-spacing: 2px; }
    .diff-btn {
      display: inline-block; margin: 0 8px; padding: 11px 22px;
      font: bold 16px Arial; border-radius: 8px; cursor: pointer;
      border: 3px solid transparent; transition: all 0.15s;
      background: rgba(255,255,255,0.1); color: #ccc;
    }
    .diff-btn:hover { background: rgba(255,255,255,0.2); }
    .diff-btn.easy.active     { border-color: #44cc88; color: #44cc88; background: rgba(68,204,136,0.2); }
    .diff-btn.normal.active   { border-color: #4488ff; color: #4488ff; background: rgba(68,136,255,0.2); }
    .diff-btn.hard.active     { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.2); }
    .diff-btn.veryhard.active { border-color: #cc00ff; color: #cc00ff; background: rgba(204,0,255,0.2); }
    #diffUI p { color: rgba(255,255,255,0.55); font: 14px Arial; margin-top: 18px; }
    #gameOverUI {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; z-index: 10;
    }
    #gameOverUI h1 { color: #ff3333; font: bold 64px Arial; margin-bottom: 12px; text-shadow: 0 0 20px #ff0000; }
    #gameOverUI p  { color: #fff; font: 20px Arial; margin-bottom: 32px; }
    .go-btn {
      display: inline-block; margin: 0 10px; padding: 13px 30px;
      font: bold 18px Arial; border-radius: 8px; cursor: pointer;
      border: 3px solid; transition: all 0.15s;
    }
    #btnReplay { border-color: #44cc88; color: #44cc88; background: rgba(68,204,136,0.15); }
    #btnReplay:hover { background: rgba(68,204,136,0.35); }
    #btnHome   { border-color: #4488ff; color: #4488ff; background: rgba(68,136,255,0.15); }
    #btnHome:hover   { background: rgba(68,136,255,0.35); }
    #homeUI {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; z-index: 10;
    }
    #homeUI h1 {
      color: #fff; font: bold 72px Arial; letter-spacing: 4px;
      text-shadow: 0 0 30px rgba(100,180,255,0.8), 0 0 60px rgba(100,180,255,0.4);
      margin-bottom: 12px;
    }
    #homeUI p { color: rgba(255,255,255,0.5); font: 16px Arial; margin-bottom: 48px; }
    #btnStart {
      padding: 16px 56px; font: bold 22px Arial; border-radius: 10px; cursor: pointer;
      border: 3px solid #1e90ff; color: #1e90ff; background: rgba(30,144,255,0.15);
      transition: all 0.15s; letter-spacing: 2px;
    }
    #btnStart:hover { background: rgba(30,144,255,0.35); box-shadow: 0 0 20px rgba(30,144,255,0.5); }
    #homeButtons { display: flex; gap: 16px; justify-content: center; margin-top: 24px; }
    .home-side-btn {
      padding: 12px 28px; font: bold 16px Arial; border-radius: 8px; cursor: pointer;
      border: 2px solid; transition: all 0.15s;
    }
    #btnShop    { border-color: #ffaa00; color: #ffaa00; background: rgba(255,170,0,0.1); }
    #btnShop:hover    { background: rgba(255,170,0,0.3); }
    #btnUpgrade { border-color: #cc44ff; color: #cc44ff; background: rgba(204,68,255,0.1); }
    #btnUpgrade:hover { background: rgba(204,68,255,0.3); }
    #btnWorld   { border-color: #44ddaa; color: #44ddaa; background: rgba(68,221,170,0.1); }
    #btnWorld:hover   { background: rgba(68,221,170,0.3); }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="homeUI">
    <h1>100스테이지 살아남기</h1>
    <p>화살과 장애물을 피해 살아남으세요</p>
    <button id="btnStart" onclick="showDiff()">시작하기</button>
    <div id="homeButtons">
      <button class="home-side-btn" id="btnShop"    onclick="alert('상점 준비 중!')">🛒 상점</button>
      <button class="home-side-btn" id="btnUpgrade" onclick="alert('업그레이드 준비 중!')">⬆ 업그레이드</button>
      <button class="home-side-btn" id="btnWorld"   onclick="alert('월드 준비 중!')">🌍 월드</button>
    </div>
  </div>

  <div id="gameOverUI">
    <h1>게임오버</h1>
    <p>체력이 모두 소진되었습니다</p>
    <button class="go-btn" id="btnReplay" onclick="replayGame()">다시 플레이</button>
    <button class="go-btn" id="btnHome"   onclick="goHome()">홈으로 가기</button>
  </div>

  <div id="diffUI" style="display:none">
    <h2>난이도 선택</h2>
    <div>
      <button class="diff-btn easy"     onclick="setDifficulty('easy')">쉬움</button>
      <button class="diff-btn normal active" onclick="setDifficulty('normal')">보통</button>
      <button class="diff-btn hard"     onclick="setDifficulty('hard')">어려움</button>
      <button class="diff-btn veryhard" onclick="setDifficulty('veryhard')">매우어려움</button>
    </div>
    <p>방향키를 눌러 시작</p>
  </div>

  <script>
    // 난이도 설정
    let difficulty = 'normal';
    const diffConfigs = {
      easy:    { arrowSpeedBase: 2.68, arrowDamage: 8,  explosionDamage: 10, greenDamage: 8,  greenSpeed: 1.3, idleLimit: 5000, blackBase: 2500, maxHp: 150 },
      normal:  { arrowSpeedBase: 4.02, arrowDamage: 12, explosionDamage: 16, greenDamage: 12, greenSpeed: 1.8, idleLimit: 3000, blackBase: 2000, maxHp: 100 },
      hard:    { arrowSpeedBase: 6.03, arrowDamage: 18, explosionDamage: 25, greenDamage: 18, greenSpeed: 2.5, idleLimit: 2000, blackBase: 1400, maxHp: 80  },
      veryhard:{ arrowSpeedBase: 8.04, arrowDamage: 25, explosionDamage: 35, greenDamage: 25, greenSpeed: 3.2, idleLimit: 1500, blackBase: 1000, maxHp: 60  },
    };

    function setDifficulty(d) {
      if (gameStarted) return;
      difficulty = d;
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.diff-btn.' + d).classList.add('active');
    }

    // 배경음악 (Web Audio API 2성부 게임 BGM)
    let audioCtx = null;
    let bgmPlaying = false;
    let bgmTimeout = null;
    let bgmNodes = [];

    function playNote(freq, duration, startTime, type = 'sawtooth', vol = 0.06) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(vol, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration * 0.85);
      osc.start(startTime);
      osc.stop(startTime + duration);
      bgmNodes.push(osc);
    }

    function scheduleBgm() {
      if (!bgmPlaying) return;
      const E = 60 / 140 / 2;
      const s = audioCtx.currentTime;
      const mel = [
        [784,E],[659,E],[523,E],[659,E],[784,E],[880,E],[784,E],[659,E],
        [698,E],[587,E],[494,E],[587,E],[698,E],[784,E],[698,E],[587,E],
        [659,E],[784,E],[880,E],[988,E],[1047,E],[988,E],[880,E],[784,E],
        [659,E],[587,E],[523,E],[587,E],[659,E*2],[523,E*2],
        [880,E],[880,E],[1047,E],[880,E],[784,E*2],[659,E],[784,E],
        [880,E],[880,E],[1047,E],[880,E],[784,E],[659,E],[523,E],[659,E],
        [784,E],[784,E],[988,E],[784,E],[698,E*2],[587,E],[698,E],
        [784,E],[698,E],[659,E],[587,E],[523,E*4],
      ];
      const bas = [
        [131,E*4],[196,E*4],[174,E*4],[131,E*4],
        [131,E*4],[196,E*4],[220,E*4],[174,E*4],
        [220,E*4],[196,E*4],[220,E*4],[131,E*4],
        [196,E*4],[174,E*4],[131,E*8],
      ];
      let t = s;
      for (const [f, d] of mel) { playNote(f, d, t, 'sawtooth', 0.06); t += d; }
      t = s;
      for (const [f, d] of bas) { playNote(f, d, t, 'square', 0.04); t += d; }
      const total = mel.reduce((a, [, d]) => a + d, 0);
      bgmTimeout = setTimeout(scheduleBgm, total * 1000 - 100);
    }

    function startBgm() {
      if (bgmPlaying) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
      bgmNodes = [];
      bgmPlaying = true;
      scheduleBgm();
    }

    function stopBgm() {
      bgmPlaying = false;
      clearTimeout(bgmTimeout);
      if (audioCtx) {
        const now = audioCtx.currentTime;
        bgmNodes.forEach(osc => { try { osc.stop(now); } catch(e) {} });
      }
      bgmNodes = [];
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let MAP_W = window.innerWidth;
    let MAP_H = window.innerHeight;
    canvas.width = MAP_W;
    canvas.height = MAP_H;

    window.addEventListener('resize', () => {
      MAP_W = window.innerWidth;
      MAP_H = window.innerHeight;
      canvas.width = MAP_W;
      canvas.height = MAP_H;
      circle.x = Math.min(Math.max(circle.x, CIRCLE_RADIUS), MAP_W - CIRCLE_RADIUS);
      circle.y = Math.min(Math.max(circle.y, CIRCLE_RADIUS), MAP_H - CIRCLE_RADIUS);
    });

    const CIRCLE_RADIUS = 20;
    const SPEED = 5.36;

    const circle = {
      x: MAP_W / 2,
      y: MAP_H / 2,
      hp: 100,
      maxHp: 100,
    };

    let arrowSpeed = 3;
    const arrows = [];
    const blackCircles = [];
    const explosions = [];
    const BLACK_RADIUS = CIRCLE_RADIUS / 1.3;
    const EXPLODE_RADIUS = CIRCLE_RADIUS * 2.2;
    const EXPLODE_DELAY = 1500;

    let stage = 1;
    const STAGE_DURATION = 20000;
    let stageStartTime = 0, stageClearAt = 0, stageClearring = false;

    function stageBlackInterval() { return Math.max(800, diffConfigs[difficulty].blackBase - (stage - 1) * 200); }
    let lastBlackSpawn = 0;
    let lastArrowSpawn = 0;
    const ARROW_INTERVAL = 300;

    function spawnBlackCircle() {
      blackCircles.push({
        x: BLACK_RADIUS + Math.random() * (MAP_W - BLACK_RADIUS * 2),
        y: BLACK_RADIUS + Math.random() * (MAP_H - BLACK_RADIUS * 2),
        explodeAt: Date.now() + EXPLODE_DELAY,
      });
    }

    function triggerExplosion(bc) {
      explosions.push({ x: bc.x, y: bc.y, r: BLACK_RADIUS, maxR: EXPLODE_RADIUS, alpha: 1 });
      if (Math.hypot(circle.x - bc.x, circle.y - bc.y) < EXPLODE_RADIUS + CIRCLE_RADIUS)
        if (Date.now() > shieldEndTime) { circle.hp = Math.max(0, circle.hp - diffConfigs[difficulty].explosionDamage); lastDamageTime = Date.now(); }
    }

    const RED_RADIUS = CIRCLE_RADIUS * 4;
    const GREEN_RADIUS = BLACK_RADIUS / 9;
    const RED_MAX_HP = 350;
    const HEART_INTERVAL = 15000;
    const HEART_HEAL = 23;
    const hearts = [];
    let lastHeartSpawn = 0;
    const SHIELD_INTERVAL = 20000;
    const SHIELD_DURATION = 6000;
    const shields = [];
    let lastShieldSpawn = 0;
    let shieldEndTime = 0;
    let redCircle = null;
    const greenCircles = [];
    let lastGreenSpawn = 0;
    const yellowBullets = [];
    let lastYellowShot = 0;
    let lastDamageTime = 0;
    let lastRegenTime = 0;
    const YELLOW_RADIUS = GREEN_RADIUS;
    const YELLOW_SPEED = 5;
    const YELLOW_INTERVAL = 300;

    function spawnRedCircle() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = Math.random() * MAP_W; y = RED_RADIUS; }
      else if (side === 1) { x = MAP_W - RED_RADIUS; y = Math.random() * MAP_H; }
      else if (side === 2) { x = Math.random() * MAP_W; y = MAP_H - RED_RADIUS; }
      else { x = RED_RADIUS; y = Math.random() * MAP_H; }
      redCircle = { x, y, hp: RED_MAX_HP };
    }

    function spawnGreenCircle() {
      if (!redCircle) return;
      const dx = circle.x - redCircle.x, dy = circle.y - redCircle.y;
      const dist = Math.hypot(dx, dy);
      const gs = diffConfigs[difficulty].greenSpeed;
      greenCircles.push({ x: redCircle.x, y: redCircle.y, vx: (dx/dist)*gs, vy: (dy/dist)*gs });
    }

    function updateYellowBullets() {
      const now = Date.now();
      if (stage === 5 && gameStarted && !stageClearring && redCircle && now - lastYellowShot >= YELLOW_INTERVAL) {
        const dx = redCircle.x - circle.x, dy = redCircle.y - circle.y;
        const dist = Math.hypot(dx, dy);
        yellowBullets.push({ x: circle.x, y: circle.y, vx: (dx/dist)*YELLOW_SPEED, vy: (dy/dist)*YELLOW_SPEED });
        lastYellowShot = now;
      }
      for (let i = yellowBullets.length - 1; i >= 0; i--) {
        const b = yellowBullets[i];
        b.x += b.vx; b.y += b.vy;
        if (redCircle && Math.hypot(b.x - redCircle.x, b.y - redCircle.y) < RED_RADIUS + YELLOW_RADIUS) {
          redCircle.hp -= 4;
          if (redCircle.hp <= 0) { redCircle = null; greenCircles.length = 0; stageClearring = true; stageClearAt = Date.now(); }
          yellowBullets.splice(i, 1); continue;
        }
        if (b.x < -50 || b.x > MAP_W + 50 || b.y < -50 || b.y > MAP_H + 50) yellowBullets.splice(i, 1);
      }
    }

    function updateGreenCircles() {
      const now = Date.now();
      if (stage === 5 && gameStarted && !stageClearring) {
        if (!redCircle) { spawnRedCircle(); lastGreenSpawn = now; }
        if (now - lastGreenSpawn >= 1500) { spawnGreenCircle(); lastGreenSpawn = now; }
      } else if (stage !== 5) { redCircle = null; greenCircles.length = 0; yellowBullets.length = 0; }
      for (let i = greenCircles.length - 1; i >= 0; i--) {
        const g = greenCircles[i];
        g.x += g.vx; g.y += g.vy;
        if (Math.hypot(g.x - circle.x, g.y - circle.y) < CIRCLE_RADIUS + GREEN_RADIUS) {
          if (Date.now() > shieldEndTime) { circle.hp = Math.max(0, circle.hp - diffConfigs[difficulty].greenDamage); lastDamageTime = Date.now(); } greenCircles.splice(i, 1); continue;
        }
        if (g.x < -50 || g.x > MAP_W + 50 || g.y < -50 || g.y > MAP_H + 50) greenCircles.splice(i, 1);
      }
    }

    function advanceStage() {
      stage++; arrowSpeed = diffConfigs[difficulty].arrowSpeedBase + (stage - 1) * 0.67;
      arrows.length = 0; blackCircles.length = 0; explosions.length = 0;
      greenCircles.length = 0; yellowBullets.length = 0; redCircle = null;
      stageStartTime = Date.now(); lastBlackSpawn = Date.now(); lastArrowSpawn = Date.now();
      lastHeartSpawn = Date.now(); stageClearring = false; lastKeyTime = Date.now();
    }

    function updateHearts() {
      const now = Date.now();
      if (gameStarted && !stageClearring && now - lastHeartSpawn >= HEART_INTERVAL) {
        hearts.push({ x: 20 + Math.random() * (MAP_W - 40), y: 20 + Math.random() * (MAP_H - 40) });
        lastHeartSpawn = now;
      }
      for (let i = hearts.length - 1; i >= 0; i--) {
        if (Math.hypot(hearts[i].x - circle.x, hearts[i].y - circle.y) < CIRCLE_RADIUS + 10) {
          circle.hp = Math.min(circle.maxHp, circle.hp + HEART_HEAL); hearts.splice(i, 1);
        }
      }
    }

    function updateShields() {
      const now = Date.now();
      if (gameStarted && !stageClearring && now - lastShieldSpawn >= SHIELD_INTERVAL) {
        shields.push({ x: 20 + Math.random() * (MAP_W - 40), y: 20 + Math.random() * (MAP_H - 40) });
        lastShieldSpawn = now;
      }
      for (let i = shields.length - 1; i >= 0; i--) {
        if (Math.hypot(shields[i].x - circle.x, shields[i].y - circle.y) < CIRCLE_RADIUS + 12) {
          shieldEndTime = Date.now() + SHIELD_DURATION; shields.splice(i, 1);
        }
      }
    }

    function drawShieldItem(x, y) {
      const t = Date.now() / 600;
      ctx.save(); ctx.translate(x, y);
      // 외곽 글로우
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(80,180,255,${0.15 + 0.1 * Math.sin(t)})`; ctx.fill();
      // 방패 몸체
      ctx.beginPath();
      ctx.moveTo(0, 14); ctx.lineTo(-10, 6); ctx.lineTo(-10, -6);
      ctx.lineTo(0, -12); ctx.lineTo(10, -6); ctx.lineTo(10, 6);
      ctx.closePath();
      ctx.fillStyle = `rgba(40,140,255,${0.85 + 0.1 * Math.sin(t)})`;
      ctx.fill();
      ctx.strokeStyle = '#88ddff'; ctx.lineWidth = 2; ctx.stroke();
      // 십자 문양
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.stroke();
      ctx.restore();
    }

    function drawBullet(g) {
      const angle = Math.atan2(g.vy, g.vx) + Math.PI / 2;
      const bw = GREEN_RADIUS * 2.2;
      const bh = GREEN_RADIUS * 5.5;
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(angle);
      // Bullet tip (bright green, rounded point)
      ctx.fillStyle = '#44ee44';
      ctx.beginPath();
      ctx.moveTo(-bw / 2, -bh * 0.05);
      ctx.lineTo(bw / 2, -bh * 0.05);
      ctx.quadraticCurveTo(bw / 2, -bh * 0.38, 0, -bh * 0.52);
      ctx.quadraticCurveTo(-bw / 2, -bh * 0.38, -bw / 2, -bh * 0.05);
      ctx.closePath();
      ctx.fill();
      // Casing body (dark green)
      ctx.fillStyle = '#228822';
      ctx.fillRect(-bw / 2, -bh * 0.05, bw, bh * 0.58);
      // Rim at bottom
      ctx.fillStyle = '#145214';
      ctx.fillRect(-bw / 2 - 2, bh * 0.5, bw + 4, bh * 0.1);
      ctx.restore();
    }

    function drawHeart(hx, hy) {
      ctx.save(); ctx.translate(hx, hy);
      const s = 11;
      ctx.fillStyle = '#e80000';
      ctx.beginPath();
      ctx.moveTo(0, s * 1.2);
      ctx.bezierCurveTo(-s * 0.15, s * 0.85, -s * 1.5, s * 0.55, -s * 1.5, 0);
      ctx.bezierCurveTo(-s * 1.5, -s * 0.75, -s * 0.75, -s * 1.1, 0, -s * 0.45);
      ctx.bezierCurveTo(s * 0.75, -s * 1.1, s * 1.5, -s * 0.75, s * 1.5, 0);
      ctx.bezierCurveTo(s * 1.5, s * 0.55, s * 0.15, s * 0.85, 0, s * 1.2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function spawnArrowToward(tx, ty) {
      const edge = Math.floor(Math.random() * 4);
      let fx, fy;
      if (edge === 0) { fx = Math.random() * MAP_W; fy = 0; }
      else if (edge === 1) { fx = MAP_W; fy = Math.random() * MAP_H; }
      else if (edge === 2) { fx = Math.random() * MAP_W; fy = MAP_H; }
      else { fx = 0; fy = Math.random() * MAP_H; }
      const dx = tx - fx, dy = ty - fy, dist = Math.hypot(dx, dy);
      arrows.push({ x: fx, y: fy, vx: (dx/dist)*arrowSpeed, vy: (dy/dist)*arrowSpeed, angle: Math.atan2(dy, dx), targetX: tx, targetY: ty });
    }

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    let gameStarted = false, lastKeyTime = 0;

    document.addEventListener('keydown', (e) => {
      if (!keys.hasOwnProperty(e.key)) return;
      e.preventDefault();
      if (!keys[e.key]) {
        if (!gameStarted) {
          gameStarted = true;
          const cfg = diffConfigs[difficulty];
          arrowSpeed = cfg.arrowSpeedBase;
          circle.maxHp = cfg.maxHp;
          circle.hp = cfg.maxHp;
          document.getElementById('diffUI').style.display = 'none';
          document.getElementById('homeUI').style.display = 'none';
          stageStartTime = Date.now(); lastBlackSpawn = Date.now(); lastArrowSpawn = Date.now();
          lastHeartSpawn = Date.now(); startBgm();
        }
        lastKeyTime = Date.now();
      }
      keys[e.key] = true;
    });
    document.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    function updateArrows() {
      for (let i = arrows.length - 1; i >= 0; i--) {
        const a = arrows[i];
        a.x += a.vx; a.y += a.vy;
        if (redCircle && Math.hypot(a.x - redCircle.x, a.y - redCircle.y) < RED_RADIUS) {
          arrows.splice(i, 1); continue;
        }
        if (Math.hypot(a.x - circle.x, a.y - circle.y) < CIRCLE_RADIUS) {
          if (Date.now() > shieldEndTime) { circle.hp = Math.max(0, circle.hp - diffConfigs[difficulty].arrowDamage); lastDamageTime = Date.now(); } arrows.splice(i, 1); continue;
        }
        if (a.x < -50 || a.x > MAP_W + 50 || a.y < -50 || a.y > MAP_H + 50) { arrows.splice(i, 1); continue; }
      }
    }

    const WARN_DIST = 3 * 60 * 1.3;

    function drawArrow(a) {
      ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.angle);
      ctx.strokeStyle = '#8B5E3C'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(14, 0); ctx.stroke();
      ctx.fillStyle = '#aaa'; ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(14,-4); ctx.lineTo(16,0); ctx.lineTo(14,4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e8e8c0'; ctx.strokeStyle = '#bbb89a'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(-10,-6); ctx.lineTo(-8,0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(-10,6); ctx.lineTo(-8,0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    function updateBlackCircles() {
      const now = Date.now();
      if (gameStarted && !stageClearring && now - lastBlackSpawn >= stageBlackInterval()) {
        spawnBlackCircle(); lastBlackSpawn = now;
      }
      for (let i = blackCircles.length - 1; i >= 0; i--) {
        if (now >= blackCircles[i].explodeAt) { triggerExplosion(blackCircles[i]); blackCircles.splice(i, 1); }
      }
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        ex.r += (ex.maxR - ex.r) * 0.15; ex.alpha -= 0.04;
        if (ex.alpha <= 0) explosions.splice(i, 1);
      }
    }

    function update() {
      if (keys.ArrowUp)    circle.y = Math.max(CIRCLE_RADIUS, circle.y - SPEED);
      if (keys.ArrowDown)  circle.y = Math.min(MAP_H - CIRCLE_RADIUS, circle.y + SPEED);
      if (keys.ArrowLeft)  circle.x = Math.max(CIRCLE_RADIUS, circle.x - SPEED);
      if (keys.ArrowRight) circle.x = Math.min(MAP_W - CIRCLE_RADIUS, circle.x + SPEED);
      const now = Date.now();
      if (gameStarted && !stageClearring && now - stageStartTime >= STAGE_DURATION && stage !== 5) { stageClearring = true; stageClearAt = now; }
      if (gameStarted && !stageClearring && circle.hp > 0 && now - lastArrowSpawn >= ARROW_INTERVAL) {
        spawnArrowToward(circle.x, circle.y); lastArrowSpawn = now;
      }
      if (stageClearring && now - stageClearAt >= 2000) advanceStage();
      if (gameStarted && circle.hp > 0 && lastDamageTime > 0 && now - lastRegenTime >= 1000) {
        circle.hp = Math.min(circle.maxHp, circle.hp + 1); lastRegenTime = now;
      }
      updateArrows(); updateBlackCircles(); updateGreenCircles(); updateYellowBullets(); updateHearts(); updateShields();
    }

    function draw() {
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, MAP_W, MAP_H);

      ctx.beginPath(); ctx.arc(circle.x, circle.y, CIRCLE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#1e90ff'; ctx.fill();
      ctx.strokeStyle = '#63b3ff'; ctx.lineWidth = 2; ctx.stroke();

      const barWidth = CIRCLE_RADIUS * 2 + 10, barHeight = 6;
      const barX = circle.x - barWidth / 2, barY = circle.y - CIRCLE_RADIUS - 12;
      ctx.fillStyle = '#333'; ctx.fillRect(barX, barY, barWidth, barHeight);
      const hpRatio = circle.hp / circle.maxHp;
      ctx.fillStyle = hpRatio > 0.5 ? '#00cc44' : hpRatio > 0.25 ? '#ffaa00' : '#ff3333';
      ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);

      if (redCircle) {
        ctx.beginPath(); ctx.arc(redCircle.x, redCircle.y, RED_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#cc1111'; ctx.fill(); ctx.strokeStyle = '#ff6666'; ctx.lineWidth = 3; ctx.stroke();
        const rbw = RED_RADIUS * 2, rbx = redCircle.x - RED_RADIUS, rby = redCircle.y - RED_RADIUS - 10;
        ctx.fillStyle = '#333'; ctx.fillRect(rbx, rby, rbw, 7);
        ctx.fillStyle = '#ff4444'; ctx.fillRect(rbx, rby, rbw * (redCircle.hp / RED_MAX_HP), 7);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
        ctx.fillText(`${redCircle.hp} / ${RED_MAX_HP}`, redCircle.x, rby - 2);
      }

      for (const g of greenCircles) drawBullet(g);

      const now = Date.now();
      for (const bc of blackCircles) {
        const remaining = bc.explodeAt - now;
        const warn = Math.max(0, 1 - remaining / EXPLODE_DELAY);
        ctx.beginPath(); ctx.arc(bc.x, bc.y, EXPLODE_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,80,0,${warn*0.25})`; ctx.fill();
        ctx.strokeStyle = `rgba(255,80,0,${0.3+warn*0.7})`; ctx.lineWidth = 2;
        ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
        const blink = remaining < 500 && Math.floor(remaining / 100) % 2 === 0;
        const r = BLACK_RADIUS;
        ctx.save(); ctx.translate(bc.x, bc.y);
        // 폭탄 몸체
        const grad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.05, 0, 0, r);
        grad.addColorStop(0, blink ? '#ff6600' : '#666');
        grad.addColorStop(0.4, blink ? '#cc2200' : '#333');
        grad.addColorStop(1, blink ? '#880000' : '#111');
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = grad; ctx.fill();
        ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.stroke();
        // 하이라이트
        ctx.beginPath(); ctx.arc(-r*0.28, -r*0.3, r*0.22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fill();
        // 뚜껑 (심지 연결부)
        ctx.fillStyle = '#555';
        ctx.fillRect(-r*0.18, -r*1.02, r*0.36, r*0.22);
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.strokeRect(-r*0.18, -r*1.02, r*0.36, r*0.22);
        // 심지 (곡선)
        ctx.beginPath();
        ctx.moveTo(r*0.08, -r*1.0);
        ctx.bezierCurveTo(r*0.4, -r*1.3, r*0.9, -r*1.1, r*1.1, -r*0.75);
        ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2.5; ctx.stroke();
        // 불꽃
        const t = Date.now() / 80;
        const fx = r*1.1, fy = -r*0.75;
        for (let i = 0; i < 6; i++) {
          const angle = (t + i * 1.05) % (Math.PI * 2);
          const fl = r * (0.18 + 0.1 * Math.sin(t * 1.3 + i));
          ctx.beginPath();
          ctx.moveTo(fx, fy);
          ctx.lineTo(fx + Math.cos(angle)*fl, fy + Math.sin(angle)*fl);
          ctx.strokeStyle = i % 2 === 0 ? '#ff6600' : '#ffcc00';
          ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.restore();
      }

      for (const ex of explosions) {
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,120,0,${ex.alpha*0.5})`; ctx.fill();
        ctx.strokeStyle = `rgba(255,200,0,${ex.alpha})`; ctx.lineWidth = 3; ctx.stroke();
      }

      for (const b of yellowBullets) {
        ctx.beginPath(); ctx.arc(b.x, b.y, YELLOW_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#ffe600'; ctx.fill();
        ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2; ctx.stroke();
      }
      for (const h of hearts) drawHeart(h.x, h.y);
      for (const s of shields) drawShieldItem(s.x, s.y);
      // 실드 활성화 시 플레이어 주위 실드 링
      if (Date.now() < shieldEndTime) {
        const t = Date.now() / 300;
        const remaining = (shieldEndTime - Date.now()) / SHIELD_DURATION;
        ctx.save();
        ctx.beginPath(); ctx.arc(circle.x, circle.y, CIRCLE_RADIUS + 7, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(80,180,255,${0.6 + 0.4 * Math.sin(t)})`; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.arc(circle.x, circle.y, CIRCLE_RADIUS + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * remaining);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
      }
      for (const a of arrows) drawArrow(a);

      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
      ctx.fillText(`${circle.hp} / ${circle.maxHp}`, circle.x, barY - 3);

      if (gameStarted && !stageClearring) {
        const stageLeft = Math.max(0, (STAGE_DURATION - (Date.now() - stageStartTime)) / 1000);
        const diffLabels = { easy:'쉬움', normal:'보통', hard:'어려움', veryhard:'매우어려움' };
        const diffColors = { easy:'#44cc88', normal:'#4488ff', hard:'#ff4444', veryhard:'#cc00ff' };
        ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
        ctx.fillText(`스테이지 ${stage}`, 8, 20);
        ctx.fillStyle = '#ffe066';
        if (stage === 5) {
          ctx.fillStyle = '#ff6666'; ctx.font = 'bold 13px Arial';
          ctx.fillText('보스를 처치하세요!', 8, 38);
        } else {
          ctx.fillText(`${stageLeft.toFixed(1)}s 생존`, 8, 38);
        }
        ctx.fillStyle = diffColors[difficulty]; ctx.font = 'bold 12px Arial';
        ctx.fillText(`[${diffLabels[difficulty]}]`, 8, 56);
      }

      if (stageClearring) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, MAP_W, MAP_H);
        ctx.textAlign = 'center'; ctx.fillStyle = '#ffe066'; ctx.font = 'bold 52px Arial';
        ctx.fillText('스테이지 클리어!', MAP_W / 2, MAP_H / 2 - 10);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Arial';
        ctx.fillText(`스테이지 ${stage + 1} 시작...`, MAP_W / 2, MAP_H / 2 + 40);
      }
    }

    function resetGameState() {
      stage = 1; gameStarted = false; stageClearring = false;
      circle.x = MAP_W / 2; circle.y = MAP_H / 2;
      circle.hp = 100; circle.maxHp = 100;
      arrowSpeed = 3;
      arrows.length = 0; blackCircles.length = 0; explosions.length = 0;
      greenCircles.length = 0; yellowBullets.length = 0; hearts.length = 0; shields.length = 0;
      redCircle = null; shieldEndTime = 0;
      lastBlackSpawn = 0; lastArrowSpawn = 0; lastHeartSpawn = 0; lastShieldSpawn = 0;
      lastYellowShot = 0; lastGreenSpawn = 0; lastKeyTime = 0; lastDamageTime = 0; lastRegenTime = 0;
      stageStartTime = 0; stageClearAt = 0;
      Object.keys(keys).forEach(k => keys[k] = false);
    }

    function replayGame() {
      document.getElementById('gameOverUI').style.display = 'none';
      resetGameState();
      const cfg = diffConfigs[difficulty];
      gameStarted = true;
      arrowSpeed = cfg.arrowSpeedBase;
      circle.maxHp = cfg.maxHp; circle.hp = cfg.maxHp;
      stageStartTime = Date.now(); lastBlackSpawn = Date.now();
      lastArrowSpawn = Date.now(); lastHeartSpawn = Date.now(); lastKeyTime = Date.now();
      startBgm();
      gameLoop();
    }

    function showDiff() {
      document.getElementById('homeUI').style.display = 'none';
      document.getElementById('diffUI').style.display = '';
    }

    function goHome() {
      document.getElementById('gameOverUI').style.display = 'none';
      resetGameState();
      document.getElementById('diffUI').style.display = 'none';
      document.getElementById('homeUI').style.display = '';
      stopBgm();
      gameLoop();
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, MAP_W, MAP_H);
      document.getElementById('gameOverUI').style.display = 'block';
    }

    function gameLoop() {
      update(); draw();
      if (circle.hp <= 0 && !stageClearring) { stopBgm(); drawGameOver(); return; }
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
