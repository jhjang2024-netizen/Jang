<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    #gameCanvas { display: block; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    // 배경음악 (Web Audio API 2성부 게임 BGM)
    let audioCtx = null;
    let bgmPlaying = false;
    let bgmTimeout = null;

    function playNote(freq, duration, startTime, type = 'sawtooth', vol = 0.06) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(vol, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration * 0.85);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    function scheduleBgm() {
      if (!bgmPlaying) return;
      const E = 60 / 140 / 2;
      const s = audioCtx.currentTime;
      const mel = [
        [784,E],[659,E],[523,E],[659,E],[784,E],[880,E],[784,E],[659,E],
        [698,E],[587,E],[494,E],[587,E],[698,E],[784,E],[698,E],[587,E],
        [659,E],[784,E],[880,E],[988,E],[1047,E],[988,E],[880,E],[784,E],
        [659,E],[587,E],[523,E],[587,E],[659,E*2],[523,E*2],
        [880,E],[880,E],[1047,E],[880,E],[784,E*2],[659,E],[784,E],
        [880,E],[880,E],[1047,E],[880,E],[784,E],[659,E],[523,E],[659,E],
        [784,E],[784,E],[988,E],[784,E],[698,E*2],[587,E],[698,E],
        [784,E],[698,E],[659,E],[587,E],[523,E*4],
      ];
      const bas = [
        [131,E*4],[196,E*4],[174,E*4],[131,E*4],
        [131,E*4],[196,E*4],[220,E*4],[174,E*4],
        [220,E*4],[196,E*4],[220,E*4],[131,E*4],
        [196,E*4],[174,E*4],[131,E*8],
      ];
      let t = s;
      for (const [f, d] of mel) { playNote(f, d, t, 'sawtooth', 0.06); t += d; }
      t = s;
      for (const [f, d] of bas) { playNote(f, d, t, 'square', 0.04); t += d; }
      const total = mel.reduce((a, [, d]) => a + d, 0);
      bgmTimeout = setTimeout(scheduleBgm, total * 1000 - 100);
    }

    function startBgm() {
      if (bgmPlaying) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      bgmPlaying = true;
      scheduleBgm();
    }

    function stopBgm() {
      bgmPlaying = false;
      clearTimeout(bgmTimeout);
      if (audioCtx) audioCtx.suspend();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let MAP_W = window.innerWidth;
    let MAP_H = window.innerHeight;
    canvas.width = MAP_W;
    canvas.height = MAP_H;

    window.addEventListener('resize', () => {
      MAP_W = window.innerWidth;
      MAP_H = window.innerHeight;
      canvas.width = MAP_W;
      canvas.height = MAP_H;
      circle.x = Math.min(Math.max(circle.x, CIRCLE_RADIUS), MAP_W - CIRCLE_RADIUS);
      circle.y = Math.min(Math.max(circle.y, CIRCLE_RADIUS), MAP_H - CIRCLE_RADIUS);
    });

    const CIRCLE_RADIUS = 20;
    const SPEED = 4;

    const circle = {
      x: MAP_W / 2,
      y: MAP_H / 2,
      hp: 100,
      maxHp: 100,
    };

    let arrowSpeed = 3;
    const arrows = [];
    const blackCircles = [];
    const explosions = [];
    const BLACK_RADIUS = CIRCLE_RADIUS / 1.3;
    const EXPLODE_RADIUS = CIRCLE_RADIUS * 2.2;
    const EXPLODE_DELAY = 1500;

    let stage = 1;
    const STAGE_DURATION = 20000;
    let stageStartTime = 0, stageClearAt = 0, stageClearring = false;

    function stageBlackInterval() { return Math.max(800, 2000 - (stage - 1) * 200); }
    let lastBlackSpawn = 0;

    function spawnBlackCircle() {
      blackCircles.push({
        x: BLACK_RADIUS + Math.random() * (MAP_W - BLACK_RADIUS * 2),
        y: BLACK_RADIUS + Math.random() * (MAP_H - BLACK_RADIUS * 2),
        explodeAt: Date.now() + EXPLODE_DELAY,
      });
    }

    function triggerExplosion(bc) {
      explosions.push({ x: bc.x, y: bc.y, r: BLACK_RADIUS, maxR: EXPLODE_RADIUS, alpha: 1 });
      if (Math.hypot(circle.x - bc.x, circle.y - bc.y) < EXPLODE_RADIUS + CIRCLE_RADIUS)
        circle.hp = Math.max(0, circle.hp - 16);
    }

    const RED_RADIUS = CIRCLE_RADIUS * 4;
    const GREEN_RADIUS = BLACK_RADIUS / 3;
    const RED_MAX_HP = 350;
    const HEART_INTERVAL = 15000;
    const HEART_HEAL = 23;
    const hearts = [];
    let lastHeartSpawn = 0;
    const GREEN_SPEED = 1.8;
    let redCircle = null;
    const greenCircles = [];
    let lastGreenSpawn = 0;

    function spawnRedCircle() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = Math.random() * MAP_W; y = RED_RADIUS; }
      else if (side === 1) { x = MAP_W - RED_RADIUS; y = Math.random() * MAP_H; }
      else if (side === 2) { x = Math.random() * MAP_W; y = MAP_H - RED_RADIUS; }
      else { x = RED_RADIUS; y = Math.random() * MAP_H; }
      redCircle = { x, y, hp: RED_MAX_HP };
    }

    function spawnGreenCircle() {
      if (!redCircle) return;
      const dx = circle.x - redCircle.x, dy = circle.y - redCircle.y;
      const dist = Math.hypot(dx, dy);
      greenCircles.push({ x: redCircle.x, y: redCircle.y, vx: (dx/dist)*GREEN_SPEED, vy: (dy/dist)*GREEN_SPEED });
    }

    function updateGreenCircles() {
      const now = Date.now();
      if (stage >= 5 && gameStarted && !stageClearring) {
        if (!redCircle) { spawnRedCircle(); lastGreenSpawn = now; }
        if (now - lastGreenSpawn >= 1500) { spawnGreenCircle(); lastGreenSpawn = now; }
      } else if (stage < 5) { redCircle = null; greenCircles.length = 0; }
      for (let i = greenCircles.length - 1; i >= 0; i--) {
        const g = greenCircles[i];
        g.x += g.vx; g.y += g.vy;
        if (Math.hypot(g.x - circle.x, g.y - circle.y) < CIRCLE_RADIUS + GREEN_RADIUS) {
          circle.hp = Math.max(0, circle.hp - 12); greenCircles.splice(i, 1); continue;
        }
        if (g.x < -50 || g.x > MAP_W + 50 || g.y < -50 || g.y > MAP_H + 50) greenCircles.splice(i, 1);
      }
    }

    function advanceStage() {
      stage++; arrowSpeed = 3 + (stage - 1) * 0.5;
      arrows.length = 0; blackCircles.length = 0; explosions.length = 0;
      greenCircles.length = 0; hearts.length = 0; redCircle = null;
      stageStartTime = Date.now(); lastBlackSpawn = Date.now();
      lastHeartSpawn = Date.now(); stageClearring = false; lastKeyTime = Date.now();
    }

    function updateHearts() {
      const now = Date.now();
      if (gameStarted && !stageClearring && now - lastHeartSpawn >= HEART_INTERVAL) {
        hearts.push({ x: 20 + Math.random() * (MAP_W - 40), y: 20 + Math.random() * (MAP_H - 40) });
        lastHeartSpawn = now;
      }
      for (let i = hearts.length - 1; i >= 0; i--) {
        if (Math.hypot(hearts[i].x - circle.x, hearts[i].y - circle.y) < CIRCLE_RADIUS + 10) {
          circle.hp = Math.min(circle.maxHp, circle.hp + HEART_HEAL); hearts.splice(i, 1);
        }
      }
    }

    function drawHeart(hx, hy) {
      ctx.save(); ctx.translate(hx, hy);
      const s = 10;
      ctx.fillStyle = '#ff3366'; ctx.strokeStyle = '#ffaacc'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, s * 0.35);
      ctx.bezierCurveTo(0, s * 0.1, -s * 0.5, -s * 0.4, -s, -s * 0.15);
      ctx.bezierCurveTo(-s * 1.5, s * 0.2, -s * 1.2, s * 0.8, 0, s * 1.2);
      ctx.bezierCurveTo(s * 1.2, s * 0.8, s * 1.5, s * 0.2, s, -s * 0.15);
      ctx.bezierCurveTo(s * 0.5, -s * 0.4, 0, s * 0.1, 0, s * 0.35);
      ctx.fill(); ctx.stroke(); ctx.restore();
    }

    function spawnArrowToward(tx, ty) {
      const edge = Math.floor(Math.random() * 4);
      let fx, fy;
      if (edge === 0) { fx = Math.random() * MAP_W; fy = 0; }
      else if (edge === 1) { fx = MAP_W; fy = Math.random() * MAP_H; }
      else if (edge === 2) { fx = Math.random() * MAP_W; fy = MAP_H; }
      else { fx = 0; fy = Math.random() * MAP_H; }
      const dx = tx - fx, dy = ty - fy, dist = Math.hypot(dx, dy);
      arrows.push({ x: fx, y: fy, vx: (dx/dist)*arrowSpeed, vy: (dy/dist)*arrowSpeed, angle: Math.atan2(dy, dx), targetX: tx, targetY: ty });
    }

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    const IDLE_LIMIT = 3000;
    let gameStarted = false, lastKeyTime = 0;

    document.addEventListener('keydown', (e) => {
      if (!keys.hasOwnProperty(e.key)) return;
      e.preventDefault();
      if (!keys[e.key]) {
        if (!gameStarted) {
          gameStarted = true;
          stageStartTime = Date.now(); lastBlackSpawn = Date.now();
          lastHeartSpawn = Date.now(); startBgm();
        }
        lastKeyTime = Date.now();
        const tx = circle.x, ty = circle.y;
        setTimeout(() => { if (circle.hp > 0) spawnArrowToward(tx, ty); }, 500);
      }
      keys[e.key] = true;
    });
    document.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    function updateArrows() {
      for (let i = arrows.length - 1; i >= 0; i--) {
        const a = arrows[i];
        a.x += a.vx; a.y += a.vy;
        if (redCircle && Math.hypot(a.x - redCircle.x, a.y - redCircle.y) < RED_RADIUS) {
          redCircle.hp -= 10;
          if (redCircle.hp <= 0) { redCircle = null; greenCircles.length = 0; }
          arrows.splice(i, 1); continue;
        }
        if (Math.hypot(a.x - circle.x, a.y - circle.y) < CIRCLE_RADIUS) {
          circle.hp = Math.max(0, circle.hp - 12); arrows.splice(i, 1); continue;
        }
        if (Math.hypot(a.targetX - a.x, a.targetY - a.y) < arrowSpeed + 1) arrows.splice(i, 1);
      }
    }

    const WARN_DIST = 3 * 60 * 1.3;

    function drawArrow(a) {
      const remaining = Math.hypot(a.targetX - a.x, a.targetY - a.y);
      if (remaining < WARN_DIST) {
        const alpha = 1 - remaining / WARN_DIST;
        ctx.save();
        ctx.strokeStyle = `rgba(255,50,50,${0.3 + alpha * 0.7})`;
        ctx.lineWidth = 3; ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.targetX, a.targetY); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
      }
      ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.angle);
      ctx.strokeStyle = '#8B5E3C'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(14, 0); ctx.stroke();
      ctx.fillStyle = '#aaa'; ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(14,-4); ctx.lineTo(16,0); ctx.lineTo(14,4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e8e8c0'; ctx.strokeStyle = '#bbb89a'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(-10,-6); ctx.lineTo(-8,0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(-10,6); ctx.lineTo(-8,0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    function updateBlackCircles() {
      const now = Date.now();
      if (gameStarted && !stageClearring && now - lastBlackSpawn >= stageBlackInterval()) {
        spawnBlackCircle(); lastBlackSpawn = now;
      }
      for (let i = blackCircles.length - 1; i >= 0; i--) {
        if (now >= blackCircles[i].explodeAt) { triggerExplosion(blackCircles[i]); blackCircles.splice(i, 1); }
      }
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        ex.r += (ex.maxR - ex.r) * 0.15; ex.alpha -= 0.04;
        if (ex.alpha <= 0) explosions.splice(i, 1);
      }
    }

    function update() {
      if (keys.ArrowUp)    circle.y = Math.max(CIRCLE_RADIUS, circle.y - SPEED);
      if (keys.ArrowDown)  circle.y = Math.min(MAP_H - CIRCLE_RADIUS, circle.y + SPEED);
      if (keys.ArrowLeft)  circle.x = Math.max(CIRCLE_RADIUS, circle.x - SPEED);
      if (keys.ArrowRight) circle.x = Math.min(MAP_W - CIRCLE_RADIUS, circle.x + SPEED);
      const now = Date.now();
      if (gameStarted && !stageClearring && now - lastKeyTime >= IDLE_LIMIT) circle.hp = 0;
      if (gameStarted && !stageClearring && now - stageStartTime >= STAGE_DURATION) { stageClearring = true; stageClearAt = now; }
      if (stageClearring && now - stageClearAt >= 2000) advanceStage();
      updateArrows(); updateBlackCircles(); updateGreenCircles(); updateHearts();
    }

    function draw() {
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, MAP_W, MAP_H);

      ctx.beginPath(); ctx.arc(circle.x, circle.y, CIRCLE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#1e90ff'; ctx.fill();
      ctx.strokeStyle = '#63b3ff'; ctx.lineWidth = 2; ctx.stroke();

      const barWidth = CIRCLE_RADIUS * 2 + 10, barHeight = 6;
      const barX = circle.x - barWidth / 2, barY = circle.y - CIRCLE_RADIUS - 12;
      ctx.fillStyle = '#333'; ctx.fillRect(barX, barY, barWidth, barHeight);
      const hpRatio = circle.hp / circle.maxHp;
      ctx.fillStyle = hpRatio > 0.5 ? '#00cc44' : hpRatio > 0.25 ? '#ffaa00' : '#ff3333';
      ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);

      if (redCircle) {
        ctx.beginPath(); ctx.arc(redCircle.x, redCircle.y, RED_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#cc1111'; ctx.fill(); ctx.strokeStyle = '#ff6666'; ctx.lineWidth = 3; ctx.stroke();
        const rbw = RED_RADIUS * 2, rbx = redCircle.x - RED_RADIUS, rby = redCircle.y - RED_RADIUS - 10;
        ctx.fillStyle = '#333'; ctx.fillRect(rbx, rby, rbw, 7);
        ctx.fillStyle = '#ff4444'; ctx.fillRect(rbx, rby, rbw * (redCircle.hp / RED_MAX_HP), 7);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
        ctx.fillText(`${redCircle.hp} / ${RED_MAX_HP}`, redCircle.x, rby - 2);
      }

      for (const g of greenCircles) {
        ctx.beginPath(); ctx.arc(g.x, g.y, GREEN_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#22cc44'; ctx.fill(); ctx.strokeStyle = '#88ffaa'; ctx.lineWidth = 2; ctx.stroke();
      }

      const now = Date.now();
      for (const bc of blackCircles) {
        const remaining = bc.explodeAt - now;
        const warn = Math.max(0, 1 - remaining / EXPLODE_DELAY);
        ctx.beginPath(); ctx.arc(bc.x, bc.y, EXPLODE_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,80,0,${warn*0.25})`; ctx.fill();
        ctx.strokeStyle = `rgba(255,80,0,${0.3+warn*0.7})`; ctx.lineWidth = 2;
        ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
        const blink = remaining < 500 && Math.floor(remaining / 100) % 2 === 0;
        ctx.beginPath(); ctx.arc(bc.x, bc.y, BLACK_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = blink ? '#ff4400' : '#111'; ctx.fill();
        ctx.strokeStyle = '#444'; ctx.lineWidth = 2; ctx.stroke();
      }

      for (const ex of explosions) {
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,120,0,${ex.alpha*0.5})`; ctx.fill();
        ctx.strokeStyle = `rgba(255,200,0,${ex.alpha})`; ctx.lineWidth = 3; ctx.stroke();
      }

      for (const h of hearts) drawHeart(h.x, h.y);
      for (const a of arrows) drawArrow(a);

      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
      ctx.fillText(`${circle.hp} / ${circle.maxHp}`, circle.x, barY - 3);

      if (gameStarted && !stageClearring) {
        const idle = Date.now() - lastKeyTime;
        const idleLeft = Math.max(0, (IDLE_LIMIT - idle) / 1000);
        ctx.font = 'bold 13px Arial';
        ctx.fillStyle = idleLeft < 1 ? '#ff3333' : '#fff';
        ctx.textAlign = 'right';
        ctx.fillText(`⏱ ${idleLeft.toFixed(1)}s`, MAP_W - 8, 20);
        const stageLeft = Math.max(0, (STAGE_DURATION - (Date.now() - stageStartTime)) / 1000);
        ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
        ctx.fillText(`스테이지 ${stage}`, 8, 20);
        ctx.fillStyle = '#ffe066';
        ctx.fillText(`${stageLeft.toFixed(1)}s 생존`, 8, 38);
      } else if (!gameStarted) {
        ctx.font = '16px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.textAlign = 'center';
        ctx.fillText('방향키를 눌러 시작하세요', MAP_W / 2, MAP_H / 2 + 40);
      }

      if (stageClearring) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, MAP_W, MAP_H);
        ctx.textAlign = 'center'; ctx.fillStyle = '#ffe066'; ctx.font = 'bold 52px Arial';
        ctx.fillText('스테이지 클리어!', MAP_W / 2, MAP_H / 2 - 10);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Arial';
        ctx.fillText(`스테이지 ${stage + 1} 시작...`, MAP_W / 2, MAP_H / 2 + 40);
      }
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, MAP_W, MAP_H);
      ctx.textAlign = 'center'; ctx.fillStyle = '#ff3333'; ctx.font = 'bold 64px Arial';
      ctx.fillText('게임오버', MAP_W / 2, MAP_H / 2);
      ctx.fillStyle = '#fff'; ctx.font = '20px Arial';
      ctx.fillText('체력이 모두 소진되었습니다', MAP_W / 2, MAP_H / 2 + 48);
    }

    function gameLoop() {
      update(); draw();
      if (circle.hp <= 0 && !stageClearring) { stopBgm(); drawGameOver(); return; }
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
