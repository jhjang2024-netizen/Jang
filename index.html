<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #gameCanvas {
      border: 3px solid #444;
      display: block;
    }

    #info {
      color: #aaa;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="info">방향키(↑ ↓ ← →)로 파란 원을 이동하세요</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const MAP_SIZE = 500;
    const CIRCLE_RADIUS = 20;
    const SPEED = 4;

    canvas.width = MAP_SIZE;
    canvas.height = MAP_SIZE;

    const circle = {
      x: MAP_SIZE / 2,
      y: MAP_SIZE / 2,
      hp: 100,
      maxHp: 100,
    };

    const ARROW_SPEED = 3;
    const MAX_ARROWS = 5;
    const arrows = [];

    function randomPos() {
      return {
        x: Math.random() * MAP_SIZE,
        y: Math.random() * MAP_SIZE,
      };
    }

    function spawnArrow() {
      const from = randomPos();
      const to = randomPos();
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const dist = Math.hypot(dx, dy);
      arrows.push({
        x: from.x,
        y: from.y,
        vx: (dx / dist) * ARROW_SPEED,
        vy: (dy / dist) * ARROW_SPEED,
        angle: Math.atan2(dy, dx),
        targetX: to.x,
        targetY: to.y,
      });
    }

    for (let i = 0; i < MAX_ARROWS; i++) spawnArrow();

    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false,
    };

    document.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) {
        e.preventDefault();
        keys[e.key] = true;
      }
    });

    document.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = false;
      }
    });

    function updateArrows() {
      for (let i = arrows.length - 1; i >= 0; i--) {
        const a = arrows[i];
        a.x += a.vx;
        a.y += a.vy;

        // 원과 충돌 감지
        if (Math.hypot(a.x - circle.x, a.y - circle.y) < CIRCLE_RADIUS) {
          circle.hp = Math.max(0, circle.hp - 17);
          arrows.splice(i, 1);
          spawnArrow();
          continue;
        }

        const dx = a.targetX - a.x;
        const dy = a.targetY - a.y;
        if (Math.hypot(dx, dy) < ARROW_SPEED + 1) {
          arrows.splice(i, 1);
          spawnArrow();
        }
      }
    }

    const WARN_DIST = ARROW_SPEED * 60 * 1.3; // 1.3초 전 경고 거리

    function drawArrow(a) {
      const remaining = Math.hypot(a.targetX - a.x, a.targetY - a.y);

      if (remaining < WARN_DIST) {
        const alpha = 1 - remaining / WARN_DIST;
        ctx.save();
        ctx.strokeStyle = `rgba(255, 50, 50, ${0.3 + alpha * 0.7})`;
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(a.targetX, a.targetY);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      const len = 20;
      const headLen = 8;
      const headAngle = Math.PI / 6;

      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.angle);

      ctx.strokeStyle = '#c8a000';
      ctx.fillStyle = '#c8a000';
      ctx.lineWidth = 2;

      // 화살 몸통
      ctx.beginPath();
      ctx.moveTo(-len / 2, 0);
      ctx.lineTo(len / 2, 0);
      ctx.stroke();

      // 화살촉
      ctx.beginPath();
      ctx.moveTo(len / 2, 0);
      ctx.lineTo(len / 2 - headLen * Math.cos(-headAngle), headLen * Math.sin(-headAngle));
      ctx.lineTo(len / 2 - headLen * Math.cos(headAngle), headLen * Math.sin(headAngle));
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function update() {
      if (keys.ArrowUp)    circle.y = Math.max(CIRCLE_RADIUS, circle.y - SPEED);
      if (keys.ArrowDown)  circle.y = Math.min(MAP_SIZE - CIRCLE_RADIUS, circle.y + SPEED);
      if (keys.ArrowLeft)  circle.x = Math.max(CIRCLE_RADIUS, circle.x - SPEED);
      if (keys.ArrowRight) circle.x = Math.min(MAP_SIZE - CIRCLE_RADIUS, circle.x + SPEED);
      updateArrows();
    }

    function draw() {
      // 회색 정사각형 맵
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

      // 파란색 원
      ctx.beginPath();
      ctx.arc(circle.x, circle.y, CIRCLE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#1e90ff';
      ctx.fill();
      ctx.strokeStyle = '#63b3ff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 체력바 배경
      const barWidth = CIRCLE_RADIUS * 2 + 10;
      const barHeight = 6;
      const barX = circle.x - barWidth / 2;
      const barY = circle.y - CIRCLE_RADIUS - 12;
      ctx.fillStyle = '#333';
      ctx.fillRect(barX, barY, barWidth, barHeight);

      // 체력바
      const hpRatio = circle.hp / circle.maxHp;
      const hpColor = hpRatio > 0.5 ? '#00cc44' : hpRatio > 0.25 ? '#ffaa00' : '#ff3333';
      ctx.fillStyle = hpColor;
      ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);

      // 화살
      for (const a of arrows) drawArrow(a);

      // 체력 수치 텍스트
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`${circle.hp} / ${circle.maxHp}`, circle.x, barY - 3);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
